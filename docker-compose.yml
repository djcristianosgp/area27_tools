version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:8080" # Maps local port 5000 to the container ASP.NET port 8080
    volumes:
      - backend-data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/area27_tools.db
      - ASPNETCORE_ENVIRONMENT=Development

  frontend:
    build:
      context: ./Frontend/area27-ui
      dockerfile: Dockerfile
    ports:
      - "80:80" # Maps local port 80 to the container Nginx port 80
    depends_on:
      - backend

volumes:
  backend-data:
