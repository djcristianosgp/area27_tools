version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "5000:8080" # Maps local port 5000 to the container ASP.NET port 8080
    volumes:
      - backend-data:/app/data
    environment:
      - ConnectionStrings__DefaultConnection=Data Source=/app/data/area27_tools.db
      - ASPNETCORE_ENVIRONMENT=Production

volumes:
  backend-data:
